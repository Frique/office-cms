<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Form — Office CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <script>
    // Extract office ID from URL
    (function() {
      const match = window.location.pathname.match(/\/admin\/office\/([^/]+)\/edit/);
      window.__officeId = match ? match[1] : null;
    })();
  </script>
</head>
<body class="admin-layout">

  <!-- Admin Header -->
  <header class="admin-header">
    <div class="admin-header__logo">
      Office CMS <span>Admin</span>
    </div>
    <div class="admin-header__actions">
      <button id="logout-btn" class="admin-header__logout">Sign Out</button>
    </div>
  </header>

  <main class="admin-main">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1 class="page-header__title" id="page-title">New Office</h1>
        <p class="page-header__subtitle">Fill in the details below</p>
      </div>
      <button id="back-btn" class="btn btn--secondary">← Back to list</button>
    </div>

    <!-- Alert -->
    <div id="alert-message" class="alert hidden" role="alert"></div>

    <!-- Hidden office ID -->
    <input type="hidden" id="office-id">

    <form id="office-form" novalidate>
      <div class="office-form">

        <!-- Left Column: Main Info -->
        <div>
          <!-- Basic Info -->
          <div class="form-card">
            <h2 class="form-card__title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              Office Information
            </h2>

            <div class="form-group">
              <label class="form-label form-label--required" for="field-name">Office Name</label>
              <input class="form-input" type="text" id="field-name" placeholder="e.g., Forest Wing - North Office" required maxlength="200">
            </div>

            <div class="form-group">
              <label class="form-label" for="field-location">Location</label>
              <input class="form-input" type="text" id="field-location" placeholder="e.g., Nairobi, Kenya" maxlength="200">
            </div>

            <div class="form-group">
              <label class="form-label" for="field-description">Description</label>
              <textarea class="form-textarea" id="field-description" rows="5" placeholder="Describe the office, its amenities, and what makes it special…" maxlength="2000"></textarea>
            </div>

            <div class="form-group">
              <label class="toggle-field">
                <label class="toggle">
                  <input type="checkbox" id="field-published" checked>
                  <span class="toggle__slider"></span>
                </label>
                <span class="toggle-label">Published (visible to visitors)</span>
              </label>
            </div>
          </div>

          <!-- Photos -->
          <div class="form-card" style="margin-top:1.5rem">
            <h2 class="form-card__title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              Photos
            </h2>

            <div id="photo-dropzone" class="photo-upload-zone" role="button" tabindex="0" aria-label="Upload photos">
              <div class="photo-upload-zone__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <polyline points="16 16 12 12 8 16"/>
                  <line x1="12" y1="12" x2="12" y2="21"/>
                  <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                </svg>
              </div>
              <p class="photo-upload-zone__title">Drop photos here or click to browse</p>
              <p class="photo-upload-zone__subtitle">JPEG, PNG, WebP · Max 5MB per file</p>
              <p class="photo-upload-zone__limit" id="photo-count-label">0/5 photos</p>
              <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" multiple style="display:none">
            </div>

            <div id="photo-previews" class="photo-previews"></div>
          </div>
        </div>

        <!-- Right Column: Contact Info -->
        <div>
          <div class="form-card">
            <h2 class="form-card__title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.55 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.12 6.12l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              Contact Details
            </h2>

            <div class="form-group">
              <label class="form-label" for="field-contact_email">Email</label>
              <input class="form-input" type="email" id="field-contact_email" placeholder="office@example.com">
            </div>

            <div class="form-group">
              <label class="form-label" for="field-contact_phone">Phone</label>
              <input class="form-input" type="tel" id="field-contact_phone" placeholder="+254 700 000 000">
            </div>

            <div class="form-group">
              <label class="form-label" for="field-contact_address">Address</label>
              <textarea class="form-textarea" id="field-contact_address" rows="3" placeholder="Street address, City, Country"></textarea>
            </div>
          </div>
        </div>

      </div>

      <!-- Save Bar -->
      <div class="save-bar">
        <span id="save-status" class="save-bar__status"></span>
        <div class="save-bar__actions">
          <button type="button" id="back-btn-2" class="btn btn--secondary" onclick="window.location.href='/admin'">Cancel</button>
          <button type="submit" id="save-btn" class="btn btn--primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Save Office
          </button>
        </div>
      </div>

    </form>

  </main>

  <script>
    // Set the hidden office-id field from URL
    document.addEventListener('DOMContentLoaded', function() {
      const id = window.__officeId;
      const idInput = document.getElementById('office-id');
      if (id && idInput) {
        idInput.value = id;
        document.getElementById('page-title').textContent = 'Edit Office';
      }
    });
  </script>
  <script src="/js/admin.js"></script>
</body>
</html>
