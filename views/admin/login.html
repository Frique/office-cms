<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Office CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-card__logo">
        <div class="login-card__logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <h1 class="login-card__title">Office CMS</h1>
        <p class="login-card__subtitle">Admin Dashboard</p>
      </div>

      <div id="error-message" class="alert alert--error hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label form-label--required" for="email">Email Address</label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="admin@offices.local"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label form-label--required" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="submit-btn" class="btn btn--primary" style="width:100%">
          Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--color-text-muted)">
        <a href="/" style="color:var(--color-secondary)">← Back to directory</a>
      </p>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
